services:
  mysql:
    image: mysql:8.0
    container_name: paperpulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-paperpulse123}
      MYSQL_DATABASE: paperpulse
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

# backend / ai-service 服务待各自 Dockerfile 完成后接入（路线图 W10-11）

volumes:
  mysql-data:
