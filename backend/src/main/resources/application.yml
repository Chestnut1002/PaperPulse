spring:
  application:
    name: paperpulse-backend
  # 本机私有配置放 application-local.yml(已被 .gitignore 忽略)。
  # 新克隆的仓库没有这个文件时,Spring 会静默跳过,自动回落到下面的默认值。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/paperpulse?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 开发期由实体类自动建表/改表;上线前改为 none 并改用迁移脚本
      ddl-auto: update
    # 关掉 Open Session in View,避免把数据库连接拖到视图渲染阶段(反模式)
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: ${BACKEND_PORT:8080}

jwt:
  # **必填,且仓库里不提供默认值。**
  # 此前这里写过一个"仅供本机开发"的回退值,它随仓库一起公开了 —— 而 JWT 的签名密钥
  # 一旦公开,读过仓库的人就能签出任意用户的 token。默认值的真正问题不是"值弱",
  # 而是它把"忘记配置"变成了"静默地用一个公开密钥运行",没有任何迹象。
  # 现在未配置时应用直接拒绝启动(校验在 JwtProperties),把一个静默的安全问题
  # 变成一个一眼可见的启动错误。
  secret: ${JWT_SECRET:}
  # token 有效期(秒),默认 24 小时
  expiration-seconds: ${JWT_EXPIRATION:86400}

app:
  ai-service:
    # Python 侧的 AI 服务。检索 Agent、后续的精读问答都走它。
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}

logging:
  level:
    com.paperpulse: DEBUG
